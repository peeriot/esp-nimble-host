# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  NimBLE Host Configuration                                                 ║
# ║                                                                            ║
# ║  This file controls the compile-time configuration of the NimBLE BLE       ║
# ║  host stack. esp-nimble-host's build.rs reads it and injects the values    ║
# ║  as C #defines before compiling NimBLE.                                    ║
# ║                                                                            ║
# ║  These are the defaults. To change them from a consuming project, create   ║
# ║  a nimble-config.toml holding only the values you want to change and set   ║
# ║  NIMBLE_CONFIG_DIR in the project's .cargo/config.toml:                    ║
# ║                                                                            ║
# ║      [env]                                                                 ║
# ║      NIMBLE_CONFIG_DIR = { value = ".", relative = true }                  ║
# ║                                                                            ║
# ║  The project file is merged over this one key by key; unknown keys are     ║
# ║  rejected. Memory estimates assume WiFi+BLE coex.                          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝


# ── Roles ────────────────────────────────────────────────────────────────────
#
# Enable only the BLE roles your application needs. Disabling unused roles
# saves flash (code is compiled out) and a small amount of RAM.
#
# For a typical Dataplane sensor adapter (scan + connect to peripherals):
#   central = true, observer = true, peripheral = false, broadcaster = false
#
# For a device that advertises services (e.g. a BLE peripheral):
#   central = false, observer = false, peripheral = true, broadcaster = true

[roles]
# Central: can initiate connections and perform GATT client operations.
central = true

# Observer: can perform passive/active BLE scanning without connecting.
observer = true

# Peripheral: can accept incoming connections and run a GATT server.
# Disable if you only connect TO other devices (saves ~2-4 KB flash).
peripheral = false

# Broadcaster: can send BLE advertisements.
# Disable if you never advertise (saves ~1-2 KB flash).
broadcaster = false


# ── Connections ──────────────────────────────────────────────────────────────
#
# The BLE controller is configured with the same limit when it is created with
# esp_nimble_host::controller_config(), so this is the only setting to change.
# Per-connection cost, measured on an ESP32-C5 with WiFi running:
#   - Controller: reserves ~1.1 KB of heap for each of the first 2 connections
#     at start-up, plus ~40 B per max_connections slot. Connections beyond the
#     first 2 are allocated from the heap only when they are established, and
#     fail then if memory is short.
#   - Host: ~0.2 KB of static RAM (connection state + L2CAP channels, which
#     auto-scale at 3 per connection: signal + ATT + SM).
#
# When changing max_connections, scale msys.block_count (below) with it: all
# ACL data, in both directions, is carried in msys blocks.

[connections]
# Maximum number of simultaneous BLE connections. Range: 1-70.
max_connections = 4


# ── Transport Buffers ────────────────────────────────────────────────────────
#
# These control the HCI transport buffer pool between the BLE host and
# controller. This is the most impactful memory tuning section.
#
# Event buffers carry HCI events (connection complete, advertising reports).
# ACL data (GATT reads/writes, notifications) does not use the transport ACL
# pool in this port: esp-nimble-host receives it into msys blocks, and the
# host sends it from msys blocks. Size [msys] for ACL traffic instead.
#
# If you see "r_os_mbuf_append returned 2" panics, increase msys.block_count.

[transport]
# Number of buffers in NimBLE's transport ACL pool (controller → host). The
# pool is allocated statically but unused by this port (see above), so raising
# this only costs RAM. Memory impact: acl_count × acl_size ≈ 6 × 251 = ~1.5 KB
acl_count = 6

# Size of each ACL buffer in bytes. 251 is the BLE 4.2 default (max single
# packet payload). Reduce to 128 if you never transfer more than ~120 bytes
# per ATT operation.
acl_size = 251

# Number of HCI event buffers (for connection events, command completions).
# Rarely needs changing.
evt_count = 4

# Number of discardable event buffers (for advertisement reports during scanning).
# Independent of max_connections. Reduce if you don't scan, or scan with
# filter_duplicates enabled.
# Memory impact: evt_discardable_count × evt_size ≈ 8 × 70 = ~560 B
evt_discardable_count = 8

# Size of each event buffer in bytes.
evt_size = 70


# ── System mbuf Pool ─────────────────────────────────────────────────────────
#
# The msys pool is NimBLE's internal memory pool for packet processing.
# All BLE data flows through this pool. If exhausted, operations fail
# with OS_ENOMEM.
#
# This is separate from the Rust heap (esp_alloc) — it's allocated once
# during nimble_port_init() from the heap, then managed internally.

[msys]
# Number of blocks in the primary msys pool.
# More blocks = can handle more concurrent BLE operations. Every received ACL
# packet holds a block until the host has processed it, and every outgoing
# ATT request holds one until sent. The default of 12 leaves ~3 blocks per
# connection at max_connections = 4; not yet measured under load on 4 links.
# Memory impact: block_count × block_size ≈ 12 × 292 = ~3.5 KB
block_count = 12

# Size of each msys block in bytes. 292 fits a maximum-size ACL packet
# (251 bytes) plus L2CAP + HCI headers. Rarely needs changing.
block_size = 292


# ── ATT / GATT ───────────────────────────────────────────────────────────────
#
# These control the GATT client and server behaviour.

[gatt]
# Preferred ATT MTU announced during MTU exchange.
# Higher = larger single reads/writes, but needs matching buffer sizes.
# 128 is a good balance for sensor data. 256 if you transfer large payloads.
# Memory impact: affects internal ATT buffer allocation.
preferred_mtu = 128

# Maximum concurrent GATT client procedures (discovery, read, write).
# Increase if you perform GATT operations on multiple connections in parallel.
max_procs = 4

# Maximum prepared write entries (GATT server only).
# Set to 0 if you only act as a GATT client (no local services).
# Memory impact: 64 entries × ~20 bytes each = ~1.3 KB saved when set to 0.
max_prep_entries = 0

# Rate to retry stalled GATT procedures (ms). When a GATT operation can't
# allocate memory, NimBLE retries after this interval.
resume_rate_ms = 1000


# ── L2CAP ────────────────────────────────────────────────────────────────────
#
# L2CAP channels are allocated per connection. The default formula
# (3 × max_connections) provides signal + ATT + SM channels per connection.
# Only change this if you use LE CoC (Connection-Oriented Channels).

[l2cap]
# Total L2CAP channels. Default: 3 × max_connections.
# Set to 0 to use the default formula.
max_channels = 0

# Maximum concurrent L2CAP signalling procedures.
max_sig_procs = 1


# ── Bonding / Storage ────────────────────────────────────────────────────────
#
# These control how many bonded devices and CCCDs can be persisted.
# Only relevant if security (pairing/bonding) is enabled.
# Currently bonding is disabled — these values are only used if you
# enable BLE_SM_BONDING in the future.

[storage]
# Maximum number of persisted bonds.
max_bonds = 3

# Maximum number of persisted client characteristic configuration descriptors.
max_cccds = 8


# ── Security Manager ─────────────────────────────────────────────────────────
#
# Controls BLE pairing. Enabling legacy=true compiles in NimBLE's SM and
# the TinyCrypt AES library needed for key derivation. sc=true additionally
# pulls in P-256 ECC (TinyCrypt) — omit for now unless a specific peripheral
# requires Secure Connections.
#
# IO capability is set at runtime (KeyboardOnly) — not a build-time knob.
# bonding=false means keys are never persisted; no ble_store backend needed.

[security]
# Enable Legacy pairing (AES-based STK derivation).
legacy = true

# Enable Secure Connections (P-256 ECDH). NimBLE supplies ECC with random
# numbers from the controller (HCI LE Rand); no platform RNG hook is needed.
sc = false

# Require MITM protection — mandatory for passkey authentication.
mitm = true

# Persist bond keys across connections. Needs a flash-backed ble_store.
bonding = false

# Maximum concurrent SM pairing procedures.
max_procs = 1

